<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>csakura — sakura tree for your terminal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #120e18; }
  canvas { display: block; }
  .hint {
    position: fixed;
    bottom: 14px;
    right: 18px;
    font: 12px/1.6 "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    color: #cdb8d4;
    opacity: 0.45;
    letter-spacing: 0.04em;
    user-select: none;
    transition: opacity 0.4s;
  }
  .hint:hover { opacity: 0.9; }
  .hint a { color: #f2a6c8; text-decoration: none; }
  /* A phone has no keyboard for the shortcuts, and no room for them beside
   * the clone counter in the other corner. */
  @media (max-width: 560px), (hover: none) {
    .hint .keys { display: none; }
  }

  /* Live release-download total, mirroring the hint in the opposite corner. */
  .dl {
    position: fixed;
    bottom: 14px;
    left: 18px;
    font: 12px/1.6 "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    color: #cdb8d4;
    opacity: 0.45;
    letter-spacing: 0.04em;
    text-decoration: none;
    user-select: none;
    transition: opacity 0.4s;
  }
  .dl:hover { opacity: 0.9; }
  .dl b {
    color: #f2a6c8;
    font-weight: 400;
    transition: color 0.9s, text-shadow 0.9s;
  }
  /* Held while a new total counts up, so an increment that lands mid-visit
   * is visible rather than a silent swap. */
  .dl.live b { color: #fff; text-shadow: 0 0 8px rgba(242, 166, 200, 0.7); }

  .menu {
    position: fixed;
    top: 12px;
    right: 14px;
    z-index: 10;
    font: 12px/1 "JetBrains Mono", "Fira Code", ui-monospace, monospace;
    user-select: none;
  }
  .menu-btn {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 8px 6px;
    background: transparent;
    border: none;
    cursor: pointer;
    opacity: 0.12;
    transition: opacity 0.35s;
  }
  .menu-btn:hover, .menu.open .menu-btn { opacity: 0.55; }
  .menu-btn span {
    display: block;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #cdb8d4;
  }
  .panel {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    padding: 10px 12px;
    background: rgba(18, 14, 24, 0.92);
    border: 1px solid rgba(205, 184, 212, 0.12);
    border-radius: 8px;
    backdrop-filter: blur(8px);
    width: 216px;
  }
  .menu.open .panel { display: block; }
  .panel label {
    display: flex;
    justify-content: space-between;
    color: #a890b0;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.7;
  }
  .panel label b { color: #f2a6c8; font-weight: 400; opacity: 0.9; }
  .panel hr {
    border: 0;
    border-top: 1px solid rgba(205, 184, 212, 0.1);
    margin: 12px 0 10px;
  }
  .panel input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    margin: 0 0 12px;
    border-radius: 2px;
    background: rgba(205, 184, 212, 0.18);
    cursor: pointer;
  }
  .panel input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 11px;
    height: 11px;
    border: 0;
    border-radius: 50%;
    background: #f2a6c8;
  }
  .panel input[type="range"]::-moz-range-thumb {
    width: 11px;
    height: 11px;
    border: 0;
    border-radius: 50%;
    background: #f2a6c8;
  }
  .chips { display: flex; gap: 6px; }
  .chip {
    flex: 1;
    padding: 6px 0;
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a890b0;
    background: rgba(205, 184, 212, 0.06);
    border: 1px solid rgba(205, 184, 212, 0.12);
    border-radius: 5px;
    cursor: pointer;
    transition: color 0.2s, background 0.2s, border-color 0.2s;
  }
  .chip:hover { background: rgba(205, 184, 212, 0.12); }
  .chip.on {
    color: #120e18;
    background: #f2a6c8;
    border-color: #f2a6c8;
  }
  .swatches {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    background: var(--c);
    transition: border-color 0.2s, transform 0.15s;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.active { border-color: #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="menu" id="menu">
  <button class="menu-btn" id="menuBtn" aria-label="colors" title="colors">
    <span></span><span></span><span></span>
  </button>
  <div class="panel">
    <label>blossom</label>
    <div class="swatches" id="swatches"></div>
    <hr>
    <label>petals <b id="vPetals">5</b></label>
    <input type="range" id="rPetals" min="1" max="10" step="1">
    <label>wind <b id="vWind">1</b></label>
    <input type="range" id="rWind" min="0" max="10" step="1">
    <label>speed <b id="vFps">24</b></label>
    <input type="range" id="rFps" min="5" max="60" step="1">
    <label>form</label>
    <div class="chips" id="forms">
      <button class="chip" data-style="yoshino" title="somei-yoshino: wide and spreading (s)">yoshino</button>
      <button class="chip" data-style="bush" title="full bloom: one rounded cloud of blossom (s)">bush</button>
      <button class="chip" data-style="shidare" title="shidare-zakura: weeping cherry (s)">shidare</button>
      <button class="chip" data-style="random" title="a new form on every regrow (s)">random</button>
    </div>
    <hr>
    <div class="chips">
      <button class="chip" id="cAscii" title="ASCII glyphs only (a)">ascii</button>
      <button class="chip" id="cFlat" title="no cell backgrounds (t)">flat</button>
      <button class="chip" id="cDetail" title="a finer, fully branched pixel tree (d)">detail</button>
      <button class="chip" id="cRegrow" title="regrow the tree (r)">regrow</button>
    </div>
  </div>
</div>
<a class="dl" id="dl" hidden
   href="https://github.com/realstrawhat/csakura"><b id="dlN">0</b> clones</a>
<div class="hint"><span class="keys">[r] regrow &nbsp;·&nbsp; [⋮] options &nbsp;·&nbsp; </span><a href="https://github.com/realstrawhat/csakura">csakura</a></div>
<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* The tree never changes between frames, so it is rendered once onto an
 * offscreen canvas and blitted each frame with only the petals drawn live. */
const treeCanvas = document.createElement("canvas");
const treeCtx = treeCanvas.getContext("2d");

/*
 * Cell size follows the window. A fixed 15px font left a small window or a
 * phone only a few dozen cells to grow the tree in, and it came out as a
 * handful of coarse blocks. Shrinking the font keeps roughly the same number of
 * cells, so every size gets the detailed tree, just drawn smaller.
 */
const FONT_MAX = 15, FONT_MIN = 8;
const COLS_WANT = 110, ROWS_WANT = 46;
let fontSize = FONT_MAX;

const PALETTES = {
  sakura:   ["#ffe3f1", "#ffd0e7", "#ffb3d9", "#ff8fc6", "#f76fae", "#e05593", "#c13d78", "#97295c"],
  rose:     ["#ffd6e0", "#ffb8c9", "#ff8fab", "#f76a8a", "#e04a6a", "#c23452", "#9e2a42", "#7a1f34"],
  blush:    ["#fff0f3", "#ffdce4", "#ffc0ce", "#ffa0b4", "#f08098", "#d86078", "#b84860", "#943848"],
  magenta:  ["#ffe0f8", "#ffc0f0", "#ff90e0", "#f060c8", "#d040b0", "#b02890", "#8c1e70", "#681850"],
  peach:    ["#ffe8d6", "#ffd4b8", "#ffb894", "#f59a6e", "#e07a4a", "#c45e32", "#a04824", "#7a3418"],
  coral:    ["#ffe0d8", "#ffc4b4", "#ffa08c", "#f57a64", "#e05540", "#c23c2a", "#9e2c1e", "#7a2016"],
  sunset:   ["#ffe8d0", "#ffd0a8", "#ffb078", "#ff9060", "#f07050", "#d05040", "#a83830", "#802828"],
  gold:     ["#fff6d0", "#ffecc0", "#ffd890", "#f0c060", "#d8a040", "#b88028", "#906018", "#684810"],
  lavender: ["#f0e6ff", "#e0d0ff", "#c9b0f5", "#b08ee6", "#9670d4", "#7a54b8", "#5e3e96", "#462e72"],
  violet:   ["#f0e0ff", "#e0c0ff", "#c890f5", "#a860e0", "#8840c8", "#6c28a8", "#501888", "#3c1068"],
  sky:      ["#e0f0ff", "#c8e4ff", "#a0d0ff", "#70b4f5", "#4898e0", "#3078c0", "#205898", "#144070"],
  mint:     ["#e0fff0", "#c0f5e0", "#90e8c8", "#60d4a8", "#40b888", "#289868", "#1c7850", "#145838"],
  matcha:   ["#e8f5d0", "#d0e8a8", "#b0d878", "#90c050", "#70a038", "#548028", "#3c6018", "#284810"],
  white:    ["#ffffff", "#fff0f5", "#ffe4ee", "#ffc8dc", "#f7a8c4", "#e080a0", "#c05c7c", "#98405c"],
  ink:      ["#e8e4f0", "#d0cce0", "#b0a8c0", "#8880a0", "#686080", "#484860", "#303048", "#202030"],
};

const MINI_TINT = {
  sakura:   ["#ffc8e0", "#ffb8d4"],
  rose:     ["#ffb8c8", "#ffa0b4"],
  blush:    ["#ffc8d4", "#ffb0c0"],
  magenta:  ["#ffb8e8", "#ffa0d8"],
  peach:    ["#ffd0b0", "#ffc098"],
  coral:    ["#ffc8b8", "#ffb4a0"],
  sunset:   ["#ffd0a0", "#ffb888"],
  gold:     ["#ffe8a8", "#ffd890"],
  lavender: ["#e0c8ff", "#d0b4f5"],
  violet:   ["#d8b0f5", "#c898e8"],
  sky:      ["#b8dcff", "#a0d0ff"],
  mint:     ["#b8f0d8", "#a0e8c8"],
  matcha:   ["#d0e8a0", "#b8d880"],
  white:    ["#ffe8f0", "#ffd4e4"],
  ink:      ["#d0cce0", "#b8b4c8"],
};

const PKEYS = Object.keys(PALETTES);

/* Same knobs the terminal build exposes, persisted between visits. */
let paletteKey = "sakura";
let optDensity = 5, optWind = 1, optFps = 24;
let optAscii = false, optFlat = false;
let optDetail = false;   /* pixel tree, see genTreeHd */
/*
 * Tree form. Somei-yoshino is the spreading, vase-shaped cherry most people
 * picture; bush is the same cherry at full bloom, its crown closed into one
 * rounded cloud of blossom; shidare-zakura is the weeping cherry, its blossom
 * hanging in curtains that nearly reach the ground. Random picks one on every
 * regrow.
 */
const STYLES = ["yoshino", "bush", "shidare", "random"];
let optStyle = "yoshino";

function loadOpts() {
  let o = {};
  try { o = JSON.parse(localStorage.getItem("csakura-opts") || "{}") || {}; } catch (e) { o = {}; }
  /* 1.x stored only the palette, under its own key */
  paletteKey = o.palette || localStorage.getItem("csakura-palette") || "sakura";
  if (!PALETTES[paletteKey]) paletteKey = "sakura";
  optDensity = clamp(o.density | 0 || 5, 1, 10);
  optWind    = clamp(o.wind === undefined ? 1 : +o.wind, 0, 10);
  optFps     = clamp(o.fps | 0 || 24, 5, 60);
  optAscii   = !!o.ascii;
  optFlat    = !!o.flat;
  optDetail  = !!o.detail;
  optStyle   = STYLES.includes(o.style) ? o.style : "yoshino";
}

function saveOpts() {
  try {
    localStorage.setItem("csakura-opts", JSON.stringify({
      palette: paletteKey, density: optDensity, wind: optWind,
      fps: optFps, ascii: optAscii, flat: optFlat, detail: optDetail,
      style: optStyle,
    }));
  } catch (e) { /* private mode — settings just won't persist */ }
}

let RAMP = PALETTES[paletteKey].slice();
const TRUNK_D = "#4a2c19", TRUNK_M = "#7d4d27", TRUNK_L = "#a8703c";
const GRASS = "#87a985";
const BG_TOP = "#1a1322", BG_BOT = "#120e18";
let FADED = "#b08aa6";

/* ---------- colour ---------- */

function hex2rgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgb2hex(r, g, b) {
  return "#" + (((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1));
}
/* t = 0 -> a, t = 1 -> b */
function mix(a, b, t) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  const A = hex2rgb(a), B = hex2rgb(b);
  return rgb2hex(
    Math.round(A[0] + (B[0] - A[0]) * t),
    Math.round(A[1] + (B[1] - A[1]) * t),
    Math.round(A[2] + (B[2] - A[2]) * t));
}
function brighten(c) {
  const [r, g, b] = hex2rgb(c);
  return rgb2hex(r + (((255 - r) * 3 / 10) | 0),
                 g + (((255 - g) * 3 / 10) | 0),
                 b + (((255 - b) * 3 / 10) | 0));
}

function isMini() {
  return window.innerWidth < 1100 || window.innerHeight < 700;
}

/* Backdrop is a vertical gradient, so every row has its own background tone.
 * Cells blend against their own row and stay seamless with the backdrop. */
let rowBg = [], rowHaze = [];

function applyRamp() {
  RAMP = PALETTES[paletteKey].slice();
  if (isMini() && MINI_TINT[paletteKey]) {
    RAMP[0] = MINI_TINT[paletteKey][0];
    RAMP[1] = MINI_TINT[paletteKey][1];
  }
  rowBg = [];
  rowHaze = [];
  for (let y = 0; y < gh; y++) {
    const bg = mix(BG_TOP, BG_BOT, gh > 1 ? (y + 0.5) / gh : 1);
    rowBg.push(bg);
    /* Partial canopy cells fade toward this rather than the raw backdrop:
     * blending a tint straight to dark plum bleeds the hue out to grey. */
    rowHaze.push(mix(bg, RAMP[6], 0.22));
  }
  FADED = mix(rowBg[gh - 1] || BG_BOT, RAMP[2], 0.70);
}

const G_FULL = "█", G_DARK = "▓", G_MED = "▒",
      G_LITE = "░", G_DOT = "·";
const BLOOMS_UNI = ["❀", "✿", "❁", "✽"];
const BLOOMS_ASC = ["&", "%", "@", "*"];
const PETAL_UNI  = ["❀", "✿", "*", "·", "∘"];
const PETAL_ASC  = ["*", "*", "o", ".", "'"];

const gFull = () => optAscii ? "@" : G_FULL;
const gDark = () => optAscii ? "%" : G_DARK;
const gMed  = () => optAscii ? ":" : G_MED;
const gLite = () => optAscii ? "." : G_LITE;
const gDot  = () => optAscii ? "." : G_DOT;
const blooms = () => optAscii ? BLOOMS_ASC : BLOOMS_UNI;

/*
 * Block glyphs are painted as solid rectangles blended toward the cell
 * background, never as text: a font renders ▒/▓ as a dither pattern, which at
 * this scale reads as grain instead of a shade. ASCII mode deliberately misses
 * every case here, so its stand-ins are drawn as the literal characters.
 */
function blockCov(g) {
  switch (g) {
    case G_FULL: return 1.00;
    case G_DARK: return 0.74;
    case G_MED:  return 0.48;
    case G_LITE: return 0.24;
  }
  return -1;
}

/* Flat mode drops the canopy shadow, so cells sit on the bare backdrop and a
 * patterned page background stays visible through the crown. */
const hazeAt = y => optFlat ? rowBg[y] : rowHaze[y];

const K_NONE = 0, K_WOOD = 1, K_CANOPY = 2, K_GROUND = 3;

let cellW = 9, cellH = 16, gw = 0, gh = 0;
let grid = [];
let sources = [];
let blobs = [];
let tips = [];
let petals = [];
let wind = 0, windTarget = 0;
let curKind = K_NONE;

const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function putBg(x, y, g, color, bg) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= gw || y >= gh) return;
  grid[y * gw + x] = { g, color, bg, kind: curKind };
}

function put(x, y, g, color) {
  putBg(x, y, g, color, rowBg[y | 0] || BG_BOT);
}

function kindAt(x, y) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= gw || y >= gh) return K_NONE;
  const c = grid[y * gw + x];
  return c ? c.kind : K_NONE;
}

/* ---------- noise ---------- */

/*
 * Falloff sits between a tight 2.2 and a soft 1.25. Too tight and the coverage
 * ramp is crossed inside a single row, giving a hard horizontal cut across the
 * crown; too soft and the per-tip blobs smear together into one smooth dome
 * instead of reading as separate clumps of blossom.
 */
function field(x, y) {
  let s = 0;
  for (const b of blobs) {
    const dx = (x - b.x) / b.rx, dy = (y - b.y) / b.ry;
    s += Math.exp(-(dx * dx + dy * dy) * 1.70);
  }
  return s;
}

function hash01(i) {
  let h = Math.imul(i, 2654435761) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 1274126177) >>> 0;
  h ^= h >>> 16;
  return (h & 0xffff) / 65535;
}

function hash2(x, y) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) & 0xffff) / 65535;
}

/* Smooth value noise in [0,1]; inputs are already divided by the feature size. */
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let tx = x - xi, ty = y - yi;
  tx = tx * tx * (3 - 2 * tx);
  ty = ty * ty * (3 - 2 * ty);
  const a = hash2(xi, yi),     b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
}

/*
 * Per-column wobble in [-0.5, 0.5], one control point every `period` cells.
 * Sampling the field at y + wobble breaks the canopy's contour: the crown is
 * only a dozen or so rows tall, so an unperturbed outline flattens into a
 * straight cut across the top.
 */
function wobble(x, period) {
  const p = x / period, c = Math.floor(p);
  let t = p - c;
  const a = hash01(c) - 0.5, b = hash01(c + 1) - 0.5;
  t = t * t * (3 - 2 * t);
  return a + (b - a) * t;
}

/* ---------- generation ---------- */

function genCanopy(cx, rx, ryDesign) {
  let bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9;
  for (const b of blobs) {
    bx0 = Math.min(bx0, b.x - b.rx); bx1 = Math.max(bx1, b.x + b.rx);
    by0 = Math.min(by0, b.y - b.ry); by1 = Math.max(by1, b.y + b.ry);
  }
  if (by0 < 0) by0 = 0;
  const x0 = (bx0 - 3) | 0, x1 = (bx1 + 3) | 0;
  const y0 = Math.max((by0 - 1) | 0, 0), y1 = (by1 + 3) | 0;

  const cy = (by0 + by1) / 2;
  const ry = Math.max((by1 - by0) / 2, 2);

  /* Feature sizes tied to the tree, so texture scales with the viewport. */
  const wobAmp = Math.max(ryDesign * 0.18, 0.8);
  const wobPer = Math.max(rx * 0.11, 2.0);
  const clumpX = Math.max(rx * 0.22, 2.0);
  const clumpY = Math.max(ryDesign * 0.26, 1.2);

  curKind = K_CANOPY;

  for (let y = y0; y <= y1; y++) {
    if (y < 0 || y >= gh) continue;
    const haze = hazeAt(y);
    for (let x = x0; x <= x1; x++) {
      if (x < 0 || x >= gw) continue;

      const wob = wobble(x, wobPer) * wobAmp;
      const f = field(x, y + wob);
      if (f < 0.20) continue;

      /* Coverage: 1 deep inside the mass, falling to 0 at the rim. */
      let cov0 = clamp((f - 0.20) / 0.60, 0, 1);
      cov0 = cov0 * cov0 * (3 - 2 * cov0);
      let cov = cov0;

      /*
       * Break the mass into blossom clumps. Without this the crown is a single
       * smooth blob — a generic tree. Two octaves, stretched horizontally, give
       * the layered clusters a cherry reads as.
       */
      const cl = 0.62 * vnoise(x / clumpX, y / clumpY)
               + 0.38 * vnoise(x / (clumpX * 0.45), y / (clumpY * 0.5));
      cov = clamp(cov * (0.50 + 1.00 * cl), 0, 1);

      /*
       * Ragged silhouette, and gaps where the clumps thin out. Gaps deep inside
       * the crown fall back to the deepest blossom tone. Dropping to the
       * backdrop, or even to the dark haze, punches holes that read as black
       * specks rather than as shadow.
       */
      if (cov < 0.55 && Math.random() > cov * 1.5) {
        if (cov0 > 0.60 && kindAt(x, y) !== K_WOOD)
          putBg(x, y, gDark(), RAMP[7], haze);
        continue;
      }

      const h = clamp((y - (cy - ry)) / (2 * ry), 0, 1);

      /* Thin the underside so the canopy trails off into wisps. */
      if (h > 0.72 && Math.random() < (h - 0.72) * 2.2 * (1.3 - cov))
        continue;

      /* Let limbs show through between clusters — dark branches threading the
       * blossom is most of the character. Driven by the noise field, not a coin
       * flip, so a limb emerges as a continuous run rather than a scatter of
       * disconnected dashes. A small crown keeps its limbs covered: at that
       * scale a limb is a lone cell, and reads as a hole. */
      if (rx >= 16 && (cov < 0.50 || cl < 0.30) && kindAt(x, y) === K_WOOD) {
        grid[y * gw + x].bg = haze;
        continue;
      }

      /*
       * Light falls from the upper left; the mass shades what's below. Thin rim
       * cells take a deep, saturated tone on purpose: a pale tint blended
       * toward a dark background turns grey, not pink.
       */
      let shade = 1.1
                + h * 5.2
                + ((x - cx) / Math.max(rx, 1)) * 0.70
                + (1 - cov) * 2.0
                + (0.5 - cl) * 2.8      /* clumps read as clusters  */
                + rand(-1.05, 1.05);    /* dither across ramp steps */

      const fu = field(x, y + wob - 1.6);
      if (fu > f * 1.10)      shade += 1.6;
      else if (fu < f * 0.85) shade -= 1.4;

      const idx = clamp(shade, 0, 7) | 0;
      const base = RAMP[idx];

      /* Solid well before the rim, so the mass stays saturated and only the
       * outer fringe dissolves. */
      let g = cov > 0.62 ? gFull()
            : cov > 0.42 ? gDark()
            : cov > 0.24 ? gMed()
            : gLite();
      let color = base, bg = haze;

      /*
       * Blossoms ride on top of the mass, densest around the rim, and step away
       * from the local tone rather than always lightening — a pale flower on
       * the pale crown is invisible.
       */
      if (Math.random() < 0.06 + 0.16 * cl + 0.14 * (1 - cov)) {
        g = pick(blooms());
        bg = mix(haze, base, cov * 0.85);
        color = idx <= 2 ? RAMP[idx + 3] : RAMP[idx - 3];
        if (idx > 2 && Math.random() < 0.35) color = brighten(color);
      }

      putBg(x, y, g, color, bg);

      if ((cov < 0.55 || fu > f * 1.10) && Math.random() < 0.5)
        sources.push([x, y]);
    }
  }

  curKind = K_NONE;
}

/*
 * Lay down one horizontal slice of wood centred on x with half-width w, using
 * partial block glyphs where the edge falls inside a cell so the taper reads as
 * a smooth curve rather than a staircase. `sides` shades the slice dark on the
 * left and light on the right. That only means something for upright wood: a
 * limb running sideways takes one tone along its length instead.
 */
function woodSpan(x, y, w, dark, mid, lite, sides) {
  const i0 = Math.floor(x - w), i1 = Math.ceil(x + w);
  for (let xi = i0; xi <= i1; xi++) {
    const l = Math.max(xi, x - w);
    const rr = Math.min(xi + 1, x + w);
    const cov = rr - l;
    if (cov <= 0.06) continue;

    /* Limbs are drawn as many overlapping slices. A slice's soft edge must not
     * eat into wood an earlier slice already laid down solid. */
    if (cov <= 0.85 && kindAt(xi, y) === K_WOOD) continue;

    const d = (xi + 0.5 - x) / Math.max(w, 0.5);
    const color = !sides ? mid : d < -0.30 ? dark : (d > 0.40 ? lite : mid);
    const g = cov > 0.85 ? gFull()
            : cov > 0.55 ? gDark()
            : cov > 0.28 ? gMed()
            : gLite();
    put(xi, y, g, color);
  }
}

function genTrunk(bx, tx, ty, maxw) {
  const baseY = gh - 2;
  const h = Math.max(baseY - ty, 2);
  const bend = rand(-1, 1) * Math.max(maxw * 0.7, 0.6);

  for (let y = ty | 0; y <= (baseY | 0); y++) {
    const t = clamp((baseY - y) / h, 0, 1);
    const x = bx + (tx - bx) * t + Math.sin(t * Math.PI) * bend;
    /* Gentle root flare — a steep one reads as a wedge, not a trunk. */
    const w = maxw * (1 - 0.45 * t) * (1 + 0.55 * Math.exp(-t * 7));
    woodSpan(x, y, Math.max(w, 0.55), TRUNK_D, TRUNK_M, TRUNK_L, true);
  }
}

function bez(a, q, b, t) {
  const u = 1 - t;
  return [u * u * a[0] + 2 * u * t * q[0] + t * t * b[0],
          u * u * a[1] + 2 * u * t * q[1] + t * t * b[1]];
}

/*
 * One limb, drawn as a quadratic curve from p0 bending toward q and ending at
 * p1, tapering from w0 to w1. A curve rather than a random walk: the walk
 * wandered off to one side often enough that the crown, which grows around the
 * limb tips, came out lopsided.
 */
function genLimb(p0, q, p1, w0, w1, mid) {
  const ar = cellH / cellW;
  const len = Math.hypot(q[0] - p0[0], (q[1] - p0[1]) * ar)
            + Math.hypot(p1[0] - q[0], (p1[1] - q[1]) * ar);
  const steps = (len * 2.5 | 0) + 4;

  for (let i = 0; i <= steps; i++) {
    const t = i / steps, u = 1 - t;
    const w = w0 + (w1 - w0) * t;
    /* The finest twigs are sub-cell width; drawing them only scatters
     * disconnected specks through the blossom. */
    if (w < 0.32) break;
    const [x, y] = bez(p0, q, p1, t);
    const dx = u * (q[0] - p0[0]) + t * (p1[0] - q[0]);
    const dy = (u * (q[1] - p0[1]) + t * (p1[1] - q[1])) * ar;
    woodSpan(x, Math.floor(y), w, TRUNK_D, mid, TRUNK_L, Math.abs(dy) > Math.abs(dx));
  }
}

function genGround(cx, rx) {
  const y = gh - 1;
  curKind = K_GROUND;

  for (let x = 0; x < gw; x++) {
    const dx = (x - cx) / (rx * 1.25);
    const p = Math.exp(-dx * dx * 2.2);
    const r = Math.random();
    /* Grass fades out with distance instead of ruling a hard line. */
    const grass = mix(rowBg[y], GRASS, 0.30 + 0.70 * p);

    if (r < p * 0.55) {
      const rr = Math.random();
      const g = rr < 0.28 ? pick(blooms()) : rr < 0.62 ? gDot() : ",";
      put(x, y, g, RAMP[2 + ((Math.random() * 4) | 0)]);
    } else if (r < p * 0.55 + 0.10) put(x, y, '"', grass);
    else if (r < p * 0.55 + 0.16)   put(x, y, ",", grass);
    else                            put(x, y, "_", grass);

    /* A drift of fallen petals gathering around the roots. */
    if (gh > 4 && Math.random() < p * 0.28)
      put(x, y - 1, Math.random() < 0.35 ? pick(blooms()) : gDot(),
          mix(rowBg[y - 1], RAMP[2 + ((Math.random() * 3) | 0)], 0.85));
  }

  curKind = K_NONE;
}

const MAX_BLOBS = 32, MAX_TIPS = 24;

function addBlobClamped(x, y, brx, bry, yTop) {
  if (blobs.length >= MAX_BLOBS) return;
  if (y - bry < yTop) y = yTop + bry;
  blobs.push({ x, y, rx: brx, ry: bry });
}

/*
 * Hang the weeping cherry's curtains: strands of blossom falling from the
 * underside of the crown. They lengthen toward the sides, so the tree reads as a
 * dome with a veil round it, and thin out as they fall rather than ending in a
 * hard line.
 */
function genCurtain(cx, rx) {
  const floorY = gh - 2;
  curKind = K_CANOPY;

  for (let x = (cx - rx * 1.05) | 0; x <= ((cx + rx * 1.05) | 0); x++) {
    if (x < 0 || x >= gw || Math.random() < 0.25) continue;

    /* The lowest blossom in the column is where the strand hangs from. */
    let y0 = -1;
    for (let y = gh - 2; y >= 0; y--)
      if (kindAt(x, y) === K_CANOPY) { y0 = y; break; }
    if (y0 < 0) continue;

    const frac = Math.min(Math.abs(x - cx) / rx, 1);
    const len = (floorY - y0) * (0.25 + 0.65 * Math.pow(frac, 0.8)) * rand(0.55, 1.0);

    for (let k = 1; k <= (len | 0); k++) {
      const y = y0 + k;
      if (y >= gh - 1 || kindAt(x, y) === K_WOOD) break;
      const t = k / Math.max(len, 1);
      if (Math.random() < t * 0.45) continue;

      const idx = clamp(1.5 + t * 3.5 + rand(-1, 1), 0, 7) | 0;
      const g = Math.random() < 0.22 ? pick(blooms())
              : t < 0.55 ? gMed()
              : gLite();
      put(x, y, g, RAMP[idx]);

      if (Math.random() < 0.15) sources.push([x, y]);
    }
  }

  curKind = K_NONE;
}

/*
 * Each form is a set of ranges rather than fixed numbers. Every tree draws its
 * own proportions from inside them, so no two come out alike, but none strays
 * outside what that kind of cherry actually looks like.
 *   crown   crown height, as a share of the tree's height
 *   spread  crown width over tree height
 *   maxw    widest the crown may get, as a share of the width
 *   dome    how far the centre limbs out-reach the outer ones
 *   lift    where the outermost limb tips sit, in crown radii
 *   lean    largest offset of the crown from the roots
 *   bend    how soon a limb turns upward: low spreads first
 */
const FORMS = {
  /* wide and spreading, vase-shaped to umbrella-topped */
  yoshino: { crown: [0.54, 0.64], spread: [1.15, 1.40], maxw: 0.80, dome: [0.40, 0.65],
             lift: [-0.15, -0.05], lean: 0.12, bend: 0.30, limbs: [4, 5] },
  /* a full, rounded cloud of blossom */
  bush:    { crown: [0.58, 0.68], spread: [1.05, 1.25], maxw: 0.78, dome: [0.50, 0.70],
             lift: [-0.10, 0.00], lean: 0.08, bend: 0.35, limbs: [4, 5] },
  /* a low dome, the curtains do the rest */
  shidare: { crown: [0.46, 0.54], spread: [0.95, 1.15], maxw: 0.70, dome: [0.45, 0.60],
             lift: [-0.12, -0.04], lean: 0.06, bend: 0.35, limbs: [4, 5] },
};
const pickIn = r => rand(r[0], r[1]);

/* Random picks a form afresh on every regrow, yoshino most often since it is
 * the cherry most people picture. */
const pickRandomForm = () =>
  Math.random() < 0.45 ? "yoshino" : Math.random() < 0.55 ? "bush" : "shidare";

function genTree() {
  grid = new Array(gw * gh).fill(null);
  sources = [];
  blobs = [];
  tips = [];

  /*
   * The tree is sized as one shape, in pixels, so it keeps its proportions at
   * every window size. It takes the full height when the window is wide enough
   * for that, and is otherwise sized off the width and stands at the bottom
   * with sky above it. Sizing the crown and the trunk separately is what grew a
   * lamppost on a phone and a pancake in a short window.
   */
  const ar = cellH / cellW;
  const ground = gh - 1;
  const topPad = gh < 20 ? 1 : clamp(gh * 0.06, 1, 4);
  const avail = Math.max(ground - topPad, 5) * ar;      /* in column widths */

  /* Random picks a form afresh on every regrow, yoshino more often since it
   * is the cherry most people picture. */
  let form = optStyle;
  if (form === "random") form = pickRandomForm();
  const F = FORMS[form];

  const tall = Math.min(avail, gw * 0.95);
  const crown = tall * pickIn(F.crown);
  /* A short, wide window gets a broader crown rather than a small one lost in
   * the middle of the screen. */
  const wide = 1 + 0.30 * clamp((gw / tall - 2) / 2, 0, 1);
  const width = Math.min(gw * F.maxw, tall * pickIn(F.spread) * wide);

  const rx = Math.max(width * 0.5, 5);
  const ry = Math.max(crown * 0.5 / ar, 2.2);

  /* Real trees lean. The crown sits off to one side of the roots and the trunk
   * curves under it; the pair is kept centred together so the tree as a whole
   * still sits in the middle of the screen. */
  const mid = gw * 0.5 + rand(-1, 1) * Math.min(1.5, gw * 0.02);
  const lean = rand(-1, 1) * F.lean * rx;

  const yTop = ground - tall / ar;
  const cx = mid + lean * 0.5;
  const cy = yTop + ry;

  /* Where the trunk splits: below the crown, so the fork is on show. */
  let fy = cy + ry * 0.95;
  fy = Math.min(fy + (gh - 2 - fy) * 0.15, gh - 3);
  /* Sized off the whole tree, not the crown, so the trunk keeps its
   * proportion whatever width the crown drew. */
  const trunkW = Math.max(tall * 0.042, 1.0);
  const limbW = Math.max(trunkW * 0.62, 0.7);

  const bx = mid - lean * 0.5;
  const tx = cx - lean * 0.2 + rand(-1, 1) * Math.max(rx * 0.03, 0.4);

  genGround(cx, rx);

  curKind = K_WOOD;
  genTrunk(bx, tx, fy, trunkW);

  /*
   * Limbs fan across the crown. The centre ones reach highest and the outer
   * ones spread wide before turning up, the silhouette a cherry is recognised
   * by. Each limb throws one twig off its outer half.
   */
  const addTip = (x, y) => { if (tips.length < MAX_TIPS) tips.push([x, y]); };
  const dome = pickIn(F.dome), lift = pickIn(F.lift);
  const limbs = rx < 12 ? 3
              : F.limbs[0] + ((Math.random() * (F.limbs[1] - F.limbs[0] + 1)) | 0);
  for (let i = 0; i < limbs; i++) {
    const s = clamp(((i + 0.5) / limbs) * 2 - 1 + rand(-0.14, 0.14), -0.95, 0.95);

    const p0 = [tx + s * trunkW * 0.5, fy + rand(-0.3, 0.6)];
    const p1 = [cx + s * rx * 0.72 + rand(-0.05, 0.05) * rx,
                cy - ry * (lift + dome * (1 - s * s)) + rand(-0.12, 0.12) * ry];
    const q  = [p0[0] + (p1[0] - p0[0]) * 0.60,
                p0[1] - (p0[1] - p1[1]) * (F.bend + rand(-0.08, 0.08))];

    genLimb(p0, q, p1, limbW, limbW * 0.35, Math.abs(s) < 0.4 ? TRUNK_M : TRUNK_L);
    addTip(p1[0], p1[1]);

    let side = s < 0 ? -1 : 1;
    if (Math.abs(s) < 0.2) side = Math.random() < 0.5 ? -1 : 1;
    const b0 = bez(p0, q, p1, rand(0.55, 0.75));
    const b1 = [clamp(b0[0] + side * rx * rand(0.18, 0.30), cx - rx * 0.85, cx + rx * 0.85),
                b0[1] - ry * rand(0.20, 0.45)];
    const bq = [b0[0] + (b1[0] - b0[0]) * 0.6, b0[1] - (b0[1] - b1[1]) * 0.2];
    genLimb(b0, bq, b1, limbW * 0.45, limbW * 0.2, TRUNK_L);
    addTip(b1[0], b1[1]);
  }
  curKind = K_NONE;

  /*
   * The canopy grows out of the limbs: one core blob, then a puff of blossom at
   * every branch tip. Laying the crown out as a fixed arrangement of blobs
   * instead gives a smooth, generic dome — the silhouette has to follow the tree
   * that was actually grown.
   */
  const lim = Math.max(yTop - ry * 0.15, 0);
  addBlobClamped(cx, cy + ry * 0.05, rx * 0.52, ry * 0.58, lim);
  for (const [px, py] of tips) {
    if (blobs.length >= MAX_BLOBS - 4) break;
    addBlobClamped(px + rand(-0.8, 0.8), py - rand(0, 0.25) * ry,
                   rx * rand(0.24, 0.32), ry * rand(0.36, 0.48), lim);
  }
  /* Low clumps so the underside hangs down in wisps. */
  for (let i = 0; i < 4 && blobs.length < MAX_BLOBS; i++) {
    const s = ((i + 0.5) / 4) * 2 - 1;
    addBlobClamped(cx + (s * 0.70 + rand(-0.08, 0.08)) * rx, cy + rand(0.35, 0.55) * ry,
                   rx * rand(0.18, 0.26), ry * rand(0.26, 0.36), lim);
  }

  genCanopy(cx, rx, ry);
  if (form === "shidare") genCurtain(cx, rx);
  renderTree();
}

/* ---------- detail mode ---------- */

/*
 * Detail mode draws the tree on a pixel canvas instead of in character cells:
 * the same thing the terminal build does with half-block pixels, two to a cell.
 * At that resolution the tree can be grown as a real branching structure
 * rather than assembled from blobs.
 *
 * The branches come from space colonisation (Runions et al., 2007). The crown
 * is filled with attraction points and the tree grows toward them from the top
 * of the trunk, a node at a time, each point dropped once a branch reaches it.
 * Branches competing for those points is what gives the structure its natural
 * look: heavy limbs that split and taper into a fine mesh of twigs.
 *
 * Tones are indices, 0 for an empty pixel: the blossom ramp, then the wood,
 * the grass and the faded petal, in the terminal build's order.
 */
const F_P0 = 0, F_TRUNK_D = 8, F_TRUNK_M = 9, F_TRUNK_L = 10;
const F_GRASS = 11, F_GRASS_M = 12, F_GRASS_D = 13;
const PK_NONE = 0, PK_WOOD = 1, PK_BLOOM = 2, PK_GROUND = 3;
const HD_MAX_NODES = 8000, HD_MAX_ATTR = 2000;

let pw = 0, ph = 0, pxSize = 4;
let pix = new Uint8Array(0), pkind = new Uint8Array(0);
let hnodes = [];

const useHd = () => optDetail && !optAscii;

function pxSet(x, y, f, kind) {
  x = Math.floor(x); y = Math.floor(y);
  if (x < 0 || y < 0 || x >= pw || y >= ph) return;
  pix[y * pw + x] = f + 1;
  pkind[y * pw + x] = kind;
}

function pxKind(x, y) {
  if (x < 0 || y < 0 || x >= pw || y >= ph) return PK_NONE;
  return pkind[y * pw + x];
}

function hdAddNode(x, y, parent) {
  if (hnodes.length >= HD_MAX_NODES) return -1;
  hnodes.push({ x, y, r: 0, parent, kids: 0, last: -1 });
  const i = hnodes.length - 1;
  if (parent >= 0) {
    hnodes[parent].kids++;
    hnodes[parent].last = i;
  }
  return i;
}

/* A petal's sources are kept in cell units, like the terminal build's. */
const addSourcePx = (x, y) => { if (sources.length < 4096) sources.push([x, y / 2]); };

/*
 * Wood is stamped as discs along each segment. A pixel's tone comes from where
 * it sits across the limb, never along it, relative to the light, which falls
 * from the upper right as it does on the canopy: a trunk reads dark on its left
 * and a sideways limb is lit along its top. A limb seen inside the crown is in
 * the blossom's shade, so it keeps to the two darker tones.
 */
function hdWoodSegment(a, b, inner) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  const steps = (len / 0.35 | 0) + 1;
  const nx = len > 0 ? -dy / len : 1, ny = len > 0 ? dx / len : 0;
  const face = nx * 0.6 - ny * 0.8 >= 0 ? 1 : -1;

  for (let s = 0; s <= steps; s++) {
    const t = s / steps;
    const x = a.x + dx * t, y = a.y + dy * t;
    const rr = a.r + (b.r - a.r) * t;

    if (rr < 0.75) {
      pxSet(x, y, rr < 0.5 || inner ? F_TRUNK_D : F_TRUNK_M, PK_WOOD);
      continue;
    }
    for (let py = Math.floor(y - rr); py <= Math.ceil(y + rr); py++) {
      for (let px = Math.floor(x - rr); px <= Math.ceil(x + rr); px++) {
        const ox = px + 0.5 - x, oy = py + 0.5 - y;
        if (ox * ox + oy * oy > rr * rr) continue;
        const lit = (ox * nx + oy * ny) / rr * face;
        const f = inner ? (lit > 0.35 ? F_TRUNK_M : F_TRUNK_D)
                : lit < -0.35 ? F_TRUNK_D : lit > 0.35 ? F_TRUNK_L : F_TRUNK_M;
        pxSet(px, py, f, PK_WOOD);
      }
    }
  }
}

function hdDrawWood() {
  for (const n of hnodes)
    if (n.parent >= 0) hdWoodSegment(hnodes[n.parent], n, false);

  /* Cherry bark is ringed with horizontal lenticels: short dark dashes across
   * the trunk and the heavy limbs. */
  for (const n of hnodes) {
    if (n.r < 2.2 || Math.random() > 0.12) continue;
    const y = Math.floor(n.y), half = n.r * rand(0.25, 0.55);
    for (let x = Math.ceil(n.x - half); x <= Math.floor(n.x + half); x++)
      if (pxKind(x, y) === PK_WOOD) pxSet(x, y, F_TRUNK_D, PK_WOOD);
  }
}

/*
 * The blossom, built the way pixel artists build foliage: one small bundle of
 * flowers, consistent in size and shape, drawn in a dark, a mid and a light
 * tone and layered toward the light. Every bundle goes down dark first; the
 * mid tone lands over it nudged toward the light, then the light tone over
 * that, nudged further, on the clusters the light reaches. The dark left
 * showing reads as the shadow under and behind each cluster, so the crown
 * takes its depth from layering alone. Shading from a smooth field instead
 * reads as embossing, or as the contour lines of a depth map.
 */
const BUNDLES = [
  ["..###..", ".#####.", "#######", ".#####.", "..#.#.."],
  [".##.##.", "#######", "#######", ".#####.", "...#..."],
  ["..##...", ".####.#", "#######", "######.", ".##.#.."],
  [".###...", "#####..", "######.", ".######", "..#.##."],
];
const SPRIG = [".###.", "#####", "#####", ".#.#."];

/* Stamp a bundle shape scaled by k, which need not be whole: the bundles have to
 * keep the same size against the branches at every tree size, or a larger tree
 * comes out as thin strings of blossom. An occasional petal catches the light
 * when asked for. */
function hdStamp(rows, x0, y0, k, f, sparkle) {
  const ncols = rows[0].length, nrows = rows.length;
  const w = Math.ceil(ncols * k), h = Math.ceil(nrows * k);
  x0 = Math.floor(x0); y0 = Math.floor(y0);
  for (let py = 0; py < h; py++) {
    const r = Math.floor(py / k);
    for (let px = 0; px < w; px++) {
      const c = Math.floor(px / k);
      if (r >= nrows || c >= ncols || rows[r][c] !== "#") continue;
      pxSet(x0 + px, y0 + py, sparkle && Math.random() < 0.06 ? F_P0 : f, PK_BLOOM);
    }
  }
}

function hdFoliage(form, cy, ry, scale) {
  const bush = form === "bush";
  const k = Math.max(1, scale * 0.75);
  const twig = Math.max(0.9, scale * 0.8);
  const spread = k * (bush ? 2.2 : 1.6);
  const bundles = [];

  /* Bundles sit along the twigs the tree grew, two at each tip. */
  for (let i = 1; i < hnodes.length; i++) {
    const nd = hnodes[i];
    const w = nd.kids === 0 ? 2 : nd.r < twig ? 1 : bush && nd.r < twig * 2.5 ? 1 : 0;
    if (nd.y > cy + ry) continue;
    for (let j = 0; j < w; j++) {
      const y = nd.y + rand(-spread, spread) * 0.6;
      const h = clamp((y - (cy - ry)) / (2 * ry), 0, 1);
      bundles.push({
        x: nd.x + rand(-spread, spread), y,
        shape: (Math.random() * 4) | 0,
        /* The lower crown sits a step deeper, the line between left ragged so
         * it never reads as a band across the crown. */
        lo: h > 0.62 + rand(-0.15, 0.15) ? 1 : 0,
        mid: Math.random() < 0.88,
        lit: Math.random() < 0.62 - h * 0.5,     /* the light favours the top */
      });
    }
  }

  for (const b of bundles)
    hdStamp(BUNDLES[b.shape], b.x - 3.5 * k, b.y - 2.5 * k, k, 5 + b.lo, false);
  for (const b of bundles) {
    if (!b.mid) continue;
    hdStamp(BUNDLES[b.shape], b.x - 2.5 * k, b.y - 3.5 * k, k, 3 + b.lo, false);
    if (Math.random() < 0.5) addSourcePx(Math.floor(b.x), Math.floor(b.y));
  }
  for (const b of bundles) {
    if (!b.lit) continue;
    hdStamp(SPRIG, b.x - 0.5 * k, b.y - 4 * k, k, 1 + b.lo, true);
  }

  /* Here and there a limb crosses in front of the blossom, dark against the
   * pink and slimmer than it is below the crown, where it is further off. The
   * choice is made once per branch, at the fork it grows from, so a limb in
   * front is one continuous run rather than loose sticks on the crown. */
  const front = new Uint8Array(hnodes.length);
  for (let i = 1; i < hnodes.length; i++) {
    const pa = hnodes[i].parent;
    front[i] = hnodes[pa].kids > 1 ? (Math.random() < 0.35 ? 1 : 0) : front[pa];
  }
  const limb = Math.max(0.9, scale * 0.7);
  for (let i = 1; i < hnodes.length; i++) {
    const nd = hnodes[i];
    if (!front[i] || nd.r < limb || nd.y > cy + ry * 0.9) continue;
    const pa = hnodes[nd.parent];
    hdWoodSegment({ ...pa, r: pa.r * 0.7 }, { ...nd, r: nd.r * 0.7 }, true);
  }
}

/*
 * The weeping cherry's strands: fine hanging twigs so thick with flower that
 * they read as continuous threads of pink, lengthening toward the edge of the
 * crown, swaying a little, and thinning out toward their tips.
 */
function hdCurtains(cx, rx, ground) {
  for (const n of hnodes) {
    const frac = Math.abs(n.x - cx) / Math.max(rx, 1);
    if (n.kids !== 0 || frac < 0.20 || Math.random() < 0.40) continue;

    const len = (ground - n.y) * (0.30 + 0.60 * Math.min(frac, 1)) * rand(0.6, 1.0);
    const drift = rand(0.02, 0.06) * (n.x < cx ? -1 : 1);
    const phase = rand(0, 2 * Math.PI);

    for (let k = 1; k < (len | 0); k++) {
      const t = k / len;
      const x = n.x + drift * k + Math.sin(k * 0.35 + phase) * 0.35, y = n.y + k;
      if (y >= ground - 1) break;
      if (Math.random() < t * t * 0.6) continue;
      /* Inside the crown the strand is hidden by the blossom; it only shows
       * once it hangs clear of it. */
      if (pxKind(Math.floor(x), Math.floor(y)) === PK_BLOOM) continue;
      const idx = clamp(1 + t * 3.2 + rand(-0.7, 0.7), 0, 7) | 0;
      pxSet(x, y, F_P0 + idx, PK_BLOOM);
      /* Flowers bunch along the strand. */
      if (Math.random() < 0.30 * (1 - t))
        pxSet(x + (Math.random() < 0.5 ? -1 : 1), y, F_P0 + Math.min(idx + 1, 7), PK_BLOOM);
      if (Math.random() < 0.05) addSourcePx(Math.floor(x), Math.floor(y));
    }
  }
}

function hdGround(bx, rx) {
  for (let x = 0; x < pw; x++) {
    const dx = (x - bx) / (rx * 1.3);
    const p = Math.exp(-dx * dx * 2);
    const grass = p > 0.55 ? F_GRASS : p > 0.20 ? F_GRASS_M : F_GRASS_D;

    pxSet(x, ph - 1, grass, PK_GROUND);
    if (Math.random() < 0.45 + 0.45 * p)
      pxSet(x, ph - 2, Math.random() < 0.3 ? F_GRASS_M : grass, PK_GROUND);

    /* Fallen petals carpet the ground under the crown. */
    if (Math.random() < p * 0.45) pxSet(x, ph - 2, 1 + ((Math.random() * 3) | 0), PK_GROUND);
    if (Math.random() < p * 0.15) pxSet(x, ph - 3, 1 + ((Math.random() * 3) | 0), PK_GROUND);
  }
}

/*
 * The blossom spreads past the outline the tree was laid out in: the flower
 * round the branch tips, strands hanging off them. So the tree is
 * measured once it has grown, and grown again a little smaller should it run
 * off the top or the sides of the screen, rather than being cut off there.
 */
function genTreeHd() {
  const form = optStyle === "random" ? pickRandomForm() : optStyle;
  const margin = ph < 40 ? 1 : 2;
  const ground = ph - 3, mid = pw * 0.5;
  let fit = 1;

  for (let attempt = 0; attempt < 4; attempt++) {
    hdGrow(form, fit);

    let top = ph, left = pw, right = -1;
    for (let y = 0; y < ph - 3; y++) {
      for (let x = 0; x < pw; x++) {
        const k = pkind[y * pw + x];
        if (k !== PK_WOOD && k !== PK_BLOOM) continue;
        if (y < top) top = y;
        if (x < left) left = x;
        if (x > right) right = x;
      }
    }
    if (right < 0 || (top >= margin && left >= margin && right <= pw - 1 - margin)) break;

    let s = 1;
    if (top < margin) s = Math.min(s, (ground - margin) / (ground - top));
    if (left < margin && left < mid) s = Math.min(s, (mid - margin) / (mid - left));
    if (right > pw - 1 - margin && right > mid)
      s = Math.min(s, (pw - 1 - margin - mid) / (right - mid));
    fit *= s * 0.97;
  }

  renderTreeHd();
}

function hdGrow(form, fit) {
  pix = new Uint8Array(pw * ph);
  pkind = new Uint8Array(pw * ph);
  sources = [];
  hnodes = [];

  const F = FORMS[form];
  const weep = form === "shidare";

  /* The same layout as the cell tree, in square pixels. */
  const ground = ph - 3;
  const topPad = ph < 40 ? 2 : clamp(ph * 0.06, 2, 8);
  const tall = Math.max(Math.min(ground - topPad, pw * 0.95) * fit, 8);
  const crown = tall * pickIn(F.crown);
  const wide = 1 + 0.30 * clamp((pw / tall - 2) / 2, 0, 1);
  const width = Math.min(pw * F.maxw * fit, tall * pickIn(F.spread) * wide);

  const rx = Math.max(width * 0.5, 4), ry = Math.max(crown * 0.5, 3);
  const mid = pw * 0.5 + rand(-1, 1) * Math.min(2, pw * 0.02);
  const lean = rand(-1, 1) * F.lean * rx;
  const cx = mid + lean * 0.5, cy = ground - tall + ry, bx = mid - lean * 0.5;

  /* Growth step and the two colonisation radii, scaled to the tree. The kill
   * distance has to exceed the step or branches circle their points. */
  const step = Math.max(1, tall / 70);
  const infl = step * 7, kill = step * 2;
  const scale = clamp(tall / 70, 1, 3.5);

  hdGround(bx, rx);

  /*
   * Attraction points fill the crown, whose outline is an ellipse with a few
   * slow lobes so it bulges into clumps instead of tracing a clean oval. The
   * underside is cut off higher on a weeping cherry, which is a dome with its
   * strands doing the rest.
   */
  const attrs = [];
  const ph1 = rand(0, 2 * Math.PI), ph2 = rand(0, 2 * Math.PI), ph3 = rand(0, 2 * Math.PI);
  const cut = weep ? 0.40 : 0.72;
  const want = clamp(Math.PI * rx * ry / (kill * kill * 1.6), 40, HD_MAX_ATTR) | 0;
  for (let tries = 0; attrs.length < want && tries < want * 20; tries++) {
    const u = rand(-1.15, 1.15), v = rand(-1.15, 1.15);
    if (v > cut) continue;
    const th = Math.atan2(v, u);
    const lobe = 1 + 0.13 * Math.sin(3 * th + ph1) + 0.08 * Math.sin(5 * th + ph2)
                   + 0.05 * Math.sin(7 * th + ph3);
    if (u * u + v * v > lobe * lobe) continue;
    attrs.push({ x: cx + u * rx, y: cy + v * ry, d: 1e9, near: -1 });
  }

  /*
   * A cherry forks low: the trunk splits into a few heavy scaffold limbs that
   * fan out and up into the crown, rather than running straight up to it. A
   * trail of points from the fork out to the underside of the crown draws each
   * of those limbs out, spaced closely enough that the growth never loses
   * sight of the next one.
   */
  const forkY = ground - tall * (weep ? rand(0.34, 0.42) : rand(0.26, 0.34));
  const crownB = cy + ry * cut;
  if (forkY > crownB) {
    const limbs = 3 + ((Math.random() * 3) | 0);
    for (let i = 0; i < limbs; i++) {
      /* Kept well inside the crown's underside, which narrows there: a trail
       * ending past its edge grows a lone bare limb. */
      const sx = ((i + 0.5) / limbs * 2 - 1) * rx * 0.50 + rand(-0.06, 0.06) * rx;
      const ex = cx + sx, ey = crownB + rand(-0.10, 0.15) * ry;
      const n = (Math.hypot(ex - bx, ey - forkY) / (infl * 0.5) | 0) + 1;
      for (let k = 1; k <= n && attrs.length < HD_MAX_ATTR; k++) {
        const t = k / n;
        /* Out first, then up: a scaffold limb spreads before it rises. */
        const tx = 1 - (1 - t) * (1 - t);
        attrs.push({ x: bx + (ex - bx) * tx, y: forkY + (ey - forkY) * t, d: 1e9, near: -1 });
      }
    }
  }

  /* The trunk grows up to the fork until the points take over, not straight
   * but along a gentle S: a cherry trunk twists and leans on its way up, and a
   * straight column reads as a post. */
  let tip = hdAddNode(bx, ground + 1, -1);
  const targetX = cx - lean * 0.1;
  const targetY = forkY > crownB ? forkY : cy + ry * 0.55;
  const sway = rand(-1, 1) * tall * 0.05;
  for (let guard = 0; guard < 600 && tip >= 0; guard++) {
    const n = hnodes[tip];
    if (n.y <= targetY || attrs.some(a => Math.hypot(a.x - n.x, a.y - n.y) < infl)) break;
    const span = Math.max(ground + 1 - targetY, 1);
    const t = clamp((ground + 1 - (n.y - step)) / span, 0, 1);
    const want = bx + (targetX - bx) * t + sway * Math.sin(t * Math.PI);
    const dx = (want - n.x) / step, dy = -1, l = Math.hypot(dx, dy);
    tip = hdAddNode(n.x + dx / l * step, n.y + dy / l * step, tip);
  }

  for (const a of attrs) {
    for (let i = 0; i < hnodes.length; i++) {
      const d = Math.hypot(a.x - hnodes[i].x, a.y - hnodes[i].y);
      if (d < a.d) { a.d = d; a.near = i; }
    }
  }

  /*
   * Colonise. Each point pulls on its nearest node; every node pulled grows one
   * step along the average pull, bent by a tropism: a yoshino's limbs spread
   * outward and their ends arch over, a weeping cherry's droop hard. Points
   * only ever need checking against the nodes added since the last round,
   * since nodes never move.
   */
  const outK = weep ? 0.25 : 0.20, downK = weep ? 0.35 : 0.10;
  for (let iter = 0; iter < 500; iter++) {
    const n0 = hnodes.length;
    const gx = new Float32Array(n0), gy = new Float32Array(n0), gc = new Int32Array(n0);
    let pulled = false;

    /* Should the growth stall with points still out of reach, widen the reach
     * for the round rather than leave part of the crown bare. */
    for (let reach = infl; !pulled && reach <= infl * 8; reach *= 2) {
      for (const a of attrs) {
        if (a.near < 0 || a.d > reach) continue;
        const n = hnodes[a.near], d = Math.max(a.d, 1e-3);
        gx[a.near] += (a.x - n.x) / d;
        gy[a.near] += (a.y - n.y) / d;
        gc[a.near]++;
        pulled = true;
      }
    }
    if (!pulled) break;

    for (let i = 0; i < n0; i++) {
      const n = hnodes[i];
      if (!gc[i] || n.kids >= 3) continue;
      let dx = gx[i], dy = gy[i], l = Math.hypot(dx, dy);
      if (l < 1e-3) { dx = rand(-1, 1); dy = -1; l = Math.hypot(dx, dy); }
      const off = (n.x - cx) / rx;
      dx = dx / l + off * outK;
      dy = dy / l + Math.abs(off) * downK;
      l = Math.hypot(dx, dy);
      const nx = n.x + dx / l * step, ny = n.y + dy / l * step;

      /* Two points pulling a node the same way would stack children on one
       * spot, round after round. */
      if (n.last >= 0 && Math.hypot(hnodes[n.last].x - nx, hnodes[n.last].y - ny) < step * 0.5)
        continue;
      if (hdAddNode(nx, ny, i) < 0) break;
    }
    if (hnodes.length === n0) break;

    for (const a of attrs) {
      if (a.near < 0) continue;
      for (let j = n0; j < hnodes.length; j++) {
        const d = Math.hypot(a.x - hnodes[j].x, a.y - hnodes[j].y);
        if (d < a.d) { a.d = d; a.near = j; }
      }
      if (a.d < kill) a.near = -1;
    }
  }

  /*
   * Thickness follows the pipe model: a limb carries what its branches carry,
   * r^2.4 summed at each fork. Children always come after their parent, so one
   * backward pass settles every radius. The result is scaled so the trunk keeps
   * the same proportion to the tree at every size.
   */
  const acc = new Float64Array(hnodes.length);
  for (let i = hnodes.length - 1; i >= 0; i--) {
    const n = hnodes[i];
    n.r = n.kids === 0 ? 0.35 : Math.pow(acc[i], 1 / 2.4);
    if (n.parent >= 0) acc[n.parent] += Math.pow(n.r, 2.4);
  }
  const k = clamp(tall * 0.040 / Math.max(hnodes[0].r, 0.1), 0.4, 3.0);
  for (const n of hnodes) {
    n.r = Math.max(n.r * k, 0.35);
    /* Gentle root flare where the trunk meets the ground. */
    const up = (ground - n.y) / (tall * 0.08);
    if (up < 1) n.r *= 1 + 0.6 * (1 - Math.max(up, 0));
  }

  hdDrawWood();
  hdFoliage(form, cy, ry, scale);
  if (weep) hdCurtains(cx, rx, ground);
}

/* The pixel tree is painted once onto the offscreen tree canvas; only the
 * petals are drawn live, as in cell mode. */
function renderTreeHd() {
  const w = window.innerWidth, h = window.innerHeight;
  const bg = treeCtx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, BG_TOP);
  bg.addColorStop(1, BG_BOT);
  treeCtx.fillStyle = bg;
  treeCtx.fillRect(0, 0, w, h);

  const tones = [null, ...RAMP, TRUNK_D, TRUNK_M, TRUNK_L,
                 GRASS, mix(BG_BOT, GRASS, 0.65), mix(BG_BOT, GRASS, 0.35), FADED]
                .map(c => c && hex2rgb(c));
  const small = document.createElement("canvas");
  small.width = pw;
  small.height = ph;
  const sctx = small.getContext("2d");
  const img = sctx.createImageData(pw, ph);
  for (let i = 0; i < pix.length; i++) {
    const t = tones[pix[i]];
    if (!t) continue;
    img.data[i * 4] = t[0];
    img.data[i * 4 + 1] = t[1];
    img.data[i * 4 + 2] = t[2];
    img.data[i * 4 + 3] = 255;
  }
  sctx.putImageData(img, 0, 0);
  treeCtx.imageSmoothingEnabled = false;
  treeCtx.drawImage(small, 0, 0, pw * pxSize, ph * pxSize);
}

/* ---------- petals ---------- */

function spawnPetal(scatter) {
  let x, y;
  if (sources.length && Math.random() < 0.85) {
    const [sx, sy] = pick(sources);
    x = sx + rand(-1, 1);
    y = sy + rand(0, 1);
  } else {
    x = Math.random() * gw;
    y = -rand(0, 3);
  }
  if (scatter) y = rand(0, gh - 2);

  return {
    x, y,
    vy: rand(0.10, 0.28),
    amp: rand(0.10, 0.45),
    freq: rand(0.05, 0.18),
    phase: Math.random() * Math.PI * 2,
    g: pick(optAscii ? PETAL_ASC : PETAL_UNI),
    /* Keep petals in the light half of the ramp — the dark end vanishes
     * against the canopy they fall out of. */
    color: RAMP[(Math.random() * 4) | 0],
    rest: -1,
  };
}

function resetPetals(scatter) {
  const n = clamp((gw * optDensity / 4) | 0, 16, 768);
  petals = [];
  for (let i = 0; i < n; i++)
    petals.push(Math.random() < 0.6 ? spawnPetal(scatter) : null);
}

function updatePetals(dt) {
  if (Math.random() < 0.008) windTarget = rand(-0.12, 0.45) * optWind;
  wind += (windTarget - wind) * 0.02;

  for (let i = 0; i < petals.length; i++) {
    const p = petals[i];
    if (!p) {
      if (Math.random() < 0.03) petals[i] = spawnPetal(false);
      continue;
    }
    if (p.rest >= 0) {
      p.rest -= dt;
      if (p.rest < 0) petals[i] = null;
      continue;
    }
    p.phase += p.freq;
    p.x += wind + p.amp * Math.sin(p.phase);
    p.y += p.vy;

    if (p.x < -2)          p.x = gw + 1;
    else if (p.x > gw + 2) p.x = -1;

    if (p.y >= gh - 1) {
      p.y = gh - 1;
      p.rest = rand(2, 7);
      p.color = FADED;
      p.g = gDot();
    }
  }
}

/* ---------- rendering ---------- */

const FONT_FAMILY = `"JetBrains Mono", "Fira Code", ui-monospace, monospace`;
let FONT = `${fontSize}px ${FONT_FAMILY}`;

function renderTree() {
  const w = window.innerWidth, h = window.innerHeight;
  const bg = treeCtx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, BG_TOP);
  bg.addColorStop(1, BG_BOT);
  treeCtx.fillStyle = bg;
  treeCtx.fillRect(0, 0, w, h);
  treeCtx.textBaseline = "top";
  treeCtx.font = FONT;

  for (let y = 0; y < gh; y++) {
    for (let x = 0; x < gw; x++) {
      const c = grid[y * gw + x];
      if (!c) continue;
      const px = x * cellW, py = y * cellH;
      const cov = blockCov(c.g);
      if (cov >= 0) {
        treeCtx.fillStyle = mix(c.bg, c.color, cov);
        treeCtx.fillRect(px, py, cellW + 1, cellH + 1);
        continue;
      }
      treeCtx.fillStyle = c.bg;
      treeCtx.fillRect(px, py, cellW + 1, cellH + 1);
      treeCtx.fillStyle = c.color;
      treeCtx.fillText(c.g, px, py);
    }
  }
}

function draw() {
  ctx.drawImage(treeCanvas, 0, 0, window.innerWidth, window.innerHeight);

  /* Detail mode drops petals as pixels, half a cell at a time. */
  if (useHd()) {
    for (const p of petals) {
      if (!p) continue;
      const px = p.x | 0, py = (p.y * 2) | 0;
      if (px < 0 || px >= pw || py < 0 || py >= ph) continue;
      ctx.fillStyle = p.color;
      ctx.fillRect(px * pxSize, py * pxSize, pxSize, pxSize);
    }
    return;
  }

  ctx.textBaseline = "top";
  ctx.font = FONT;
  for (const p of petals) {
    if (!p) continue;
    const px = p.x | 0, py = p.y | 0;
    if (px < 0 || px >= gw || py < 0 || py >= gh) continue;
    ctx.fillStyle = p.color;
    ctx.fillText(p.g, px * cellW, py * cellH);
  }
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  for (const cv of [canvas, treeCanvas]) {
    cv.width = window.innerWidth * dpr;
    cv.height = window.innerHeight * dpr;
  }
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  treeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (useHd()) {
    /* A pixel fine enough for the branching to read at any window size, a
     * cell being two pixels tall as it is in the terminal. */
    pxSize = clamp(Math.round(Math.min(window.innerWidth, window.innerHeight * 1.6) / 320), 2, 6);
    cellW = pxSize;
    cellH = pxSize * 2;
    gw = Math.max((window.innerWidth / cellW) | 0, 20);
    gh = Math.max((window.innerHeight / cellH) | 0, 12);
    pw = gw;
    ph = gh * 2;
  } else {
    /* Measure the glyph width at a reference size, then pick the font that
     * fits the wanted grid, capped so a large screen keeps its crisp 15px
     * cells. */
    ctx.font = `100px ${FONT_FAMILY}`;
    const wPer = ctx.measureText(G_FULL).width / 100;
    fontSize = clamp(Math.min(window.innerWidth / (COLS_WANT * wPer),
                              window.innerHeight / (ROWS_WANT * 1.06)),
                     FONT_MIN, FONT_MAX);
    FONT = `${fontSize}px ${FONT_FAMILY}`;
    ctx.font = FONT;
    cellW = ctx.measureText(G_FULL).width;
    cellH = fontSize * 1.06;
    gw = Math.max((window.innerWidth / cellW) | 0, 20);
    gh = Math.max((window.innerHeight / cellH) | 0, 12);
  }

  applyRamp();
  grow();
  resetPetals(true);
}

/* The half-block pixels are unicode in the terminal, so ASCII mode falls back
 * to the cell tree there; the web build keeps the two in step. */
function grow() {
  if (useHd()) genTreeHd();
  else genTree();
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 150);
});

const menu = document.getElementById("menu");
const menuBtn = document.getElementById("menuBtn");
const swatches = document.getElementById("swatches");

const $ = id => document.getElementById(id);
const rPetals = $("rPetals"), rWind = $("rWind"), rFps = $("rFps");
const vPetals = $("vPetals"), vWind = $("vWind"), vFps = $("vFps");
const cAscii = $("cAscii"), cFlat = $("cFlat"), cRegrow = $("cRegrow"), cDetail = $("cDetail");
const forms = $("forms");

/* Push the current options into the panel. Keeps the sliders and chips honest
 * when a keyboard shortcut is what actually changed them. */
function syncUI() {
  rPetals.value = optDensity; vPetals.textContent = optDensity;
  rWind.value   = optWind;    vWind.textContent   = optWind;
  rFps.value    = optFps;     vFps.textContent    = optFps;
  cAscii.classList.toggle("on", optAscii);
  cFlat.classList.toggle("on", optFlat);
  cDetail.classList.toggle("on", optDetail);
  forms.querySelectorAll(".chip").forEach(el =>
    el.classList.toggle("on", el.dataset.style === optStyle));
  swatches.querySelectorAll(".swatch").forEach(el =>
    el.classList.toggle("active", el.dataset.key === paletteKey));
}

function regrow() {
  grow();
  resetPetals(false);
}

/* Palette, ASCII and flat all change how cells are generated, not just drawn. */
function restyle() {
  applyRamp();
  regrow();
}

function setPalette(key) {
  paletteKey = key;
  saveOpts();
  restyle();
  syncUI();
}

rPetals.addEventListener("input", () => {
  optDensity = +rPetals.value;
  vPetals.textContent = optDensity;
  resetPetals(false);
  saveOpts();
});
rWind.addEventListener("input", () => {
  optWind = +rWind.value;
  vWind.textContent = optWind;
  saveOpts();
});
rFps.addEventListener("input", () => {
  optFps = +rFps.value;
  vFps.textContent = optFps;
  saveOpts();
});
cAscii.addEventListener("click", () => {
  optAscii = !optAscii;
  saveOpts();
  if (optDetail) resize();
  else restyle();
  syncUI();
});
/* Detail mode has its own pixel grid, so switching it lays the grid out again. */
cDetail.addEventListener("click", () => {
  optDetail = !optDetail;
  saveOpts();
  resize();
  syncUI();
});
cFlat.addEventListener("click", () => {
  optFlat = !optFlat;
  saveOpts();
  restyle();
  syncUI();
});
function setStyle(style) {
  optStyle = style;
  saveOpts();
  regrow();
  syncUI();
}
forms.querySelectorAll(".chip").forEach(el =>
  el.addEventListener("click", () => setStyle(el.dataset.style)));
cRegrow.addEventListener("click", regrow);

/* Same shortcuts as the terminal build. */
window.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const i = PKEYS.indexOf(paletteKey);
  switch (e.key) {
    case "r": case "R": regrow(); return;
    case "c": setPalette(PKEYS[(i + 1) % PKEYS.length]); return;
    case "C": setPalette(PKEYS[(i + PKEYS.length - 1) % PKEYS.length]); return;
    case "a": case "A": cAscii.click(); return;
    case "s": case "S":
      setStyle(STYLES[(STYLES.indexOf(optStyle) + 1) % STYLES.length]); return;
    case "t": case "T": cFlat.click(); return;
    case "d": case "D": cDetail.click(); return;
    case "p": optDensity = clamp(optDensity + 1, 1, 10); resetPetals(false); break;
    case "P": optDensity = clamp(optDensity - 1, 1, 10); resetPetals(false); break;
    case "w": optWind = clamp(optWind + 1, 0, 10); break;
    case "W": optWind = clamp(optWind - 1, 0, 10); break;
    case "+": case "=": optFps = clamp(optFps + 5, 5, 60); break;
    case "-": case "_": optFps = clamp(optFps - 5, 5, 60); break;
    case "Escape": menu.classList.remove("open"); return;
    default: return;
  }
  saveOpts();
  syncUI();
});

const SWATCH_PREVIEW = {
  sakura: "#f76fae", rose: "#f76a8a", blush: "#f08098", magenta: "#d040b0",
  peach: "#f59a6e", coral: "#f57a64", sunset: "#f07050", gold: "#f0c060",
  lavender: "#b08ee6", violet: "#a860e0", sky: "#70b4f5", mint: "#60d4a8",
  matcha: "#90c050", white: "#ffe4ee", ink: "#8880a0",
};

for (const key of PKEYS) {
  const b = document.createElement("button");
  b.className = "swatch";
  b.dataset.key = key;
  b.style.setProperty("--c", SWATCH_PREVIEW[key]);
  b.title = key;
  b.addEventListener("click", () => setPalette(key));
  swatches.appendChild(b);
}

menuBtn.addEventListener("click", e => {
  e.stopPropagation();
  menu.classList.toggle("open");
});
document.addEventListener("click", e => {
  if (!menu.contains(e.target)) menu.classList.remove("open");
});

/* ---------- live download counter ---------- */

/*
 * Total clones of the repository, which is what people mean by "downloads".
 *
 * This cannot be read from the browser. GitHub's traffic API requires a token
 * with push access, and shipping one to a public page would hand every visitor
 * write access to the repo. So .github/workflows/traffic.yml polls it from CI
 * and publishes a plain JSON file to the `traffic-data` branch; this only ever
 * reads that file, unauthenticated.
 *
 * The same workflow is what gives the number a memory: the traffic API serves
 * a rolling 14-day window, so a total accumulated anywhere else would silently
 * shrink as old days expired.
 */

const DL_SRC = "https://raw.githubusercontent.com/realstrawhat/csakura/traffic-data/traffic.json";
/* raw.githubusercontent caches for around five minutes and the workflow only
 * refreshes every six hours, so polling faster than this buys nothing. */
const DL_POLL = 5 * 60 * 1000;
const DL_MIN_GAP = 60 * 1000;

const dlEl = document.getElementById("dl");
const dlNum = document.getElementById("dlN");

let dlTotal = null;     /* last total we know of */
let dlLastFetch = 0;
let dlRaf = null;
let dlLiveTimer = null;

/* Hover text carries the detail the one-line counter cannot. Daily uniques are
 * summed, so someone who clones on three days counts three times — it is an
 * upper bound on people, and says so rather than implying a headcount. */
function dlTitle(d) {
  const n = v => (v || 0).toLocaleString("en-US");
  const c = d.clones || {}, lines = [];

  lines.push(`${n(c.total)} clones`);
  /* Keep the estimated head start separate from what was actually measured,
   * so the headline number is never mistaken for all-measured. */
  if (c.baseline)
    lines.push(`  ${n(c.measured)} recorded + ${n(c.baseline)} before tracking began`);
  lines.push(`  up to ${n(c.uniques)} unique cloners`);
  /* GitHub's traffic API serves whole days only, and runs about a day behind,
   * so the total sits still between one day's data landing and the next.
   * Naming the last day actually counted is what separates "nothing new has
   * landed yet" from "the collector broke" — the `updated` line below moves
   * every run either way, so on its own it cannot tell those apart. */
  const counted = Object.keys(c.days || {});
  if (counted.length) lines.push(`  counted through ${counted[counted.length - 1]}`);
  lines.push(`${n(d.views && d.views.total)} views`);
  if (d.releaseDownloads) lines.push(`${n(d.releaseDownloads)} release downloads`);
  if (d.updated) lines.push(`updated ${d.updated.replace("T", " ").replace("Z", " UTC")}`);
  return lines.join("\n");
}

async function dlFetch() {
  const res = await fetch(DL_SRC, { cache: "no-store" });
  /* 404 until the workflow has run at least once. */
  if (!res.ok) throw new Error("traffic.json " + res.status);
  const data = await res.json();
  const total = data.clones && data.clones.total;
  if (typeof total !== "number") throw new Error("malformed traffic.json");
  dlEl.title = dlTitle(data);
  return total;
}

/* Count up to the new total instead of snapping to it. `instant` is for the
 * cached value restored on load, which has nothing to count up from. */
function dlShow(total, instant) {
  dlEl.hidden = false;
  const from = (dlTotal === null || instant) ? total : dlTotal;
  dlTotal = total;

  if (dlRaf) cancelAnimationFrame(dlRaf);
  if (from === total) {
    dlNum.textContent = total.toLocaleString("en-US");
    return;
  }

  dlEl.classList.add("live");
  clearTimeout(dlLiveTimer);

  const t0 = performance.now(), dur = 700;
  const step = now => {
    const t = Math.min((now - t0) / dur, 1);
    const e = 1 - Math.pow(1 - t, 3);
    dlNum.textContent = Math.round(from + (total - from) * e).toLocaleString("en-US");
    if (t < 1) {
      dlRaf = requestAnimationFrame(step);
    } else {
      dlRaf = null;
      dlLiveTimer = setTimeout(() => dlEl.classList.remove("live"), 900);
    }
  };
  dlRaf = requestAnimationFrame(step);
}

async function dlRefresh() {
  const now = Date.now();
  if (now - dlLastFetch < DL_MIN_GAP) return;
  dlLastFetch = now;
  try {
    const total = await dlFetch();
    try {
      localStorage.setItem("csakura-traffic", JSON.stringify({ total, at: now }));
    } catch (e) { /* private mode */ }
    dlShow(total);
  } catch (e) {
    /* Offline, or the workflow has not published yet: leave whatever is on
     * screen. Nothing is shown at all until one fetch (or a cached value)
     * succeeds, so a missing traffic.json is invisible rather than broken. */
  }
}

/* Seed from the last known total so a slow or failed load still shows a number. */
try {
  const cached = JSON.parse(localStorage.getItem("csakura-traffic") || "null");
  if (cached && typeof cached.total === "number") dlShow(cached.total, true);
} catch (e) { /* ignore */ }

setInterval(() => { if (!document.hidden) dlRefresh(); }, DL_POLL);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) dlRefresh();
});
dlRefresh();

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / optFps) return;
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  updatePetals(dt);
  draw();
}

loadOpts();
syncUI();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
